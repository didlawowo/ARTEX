{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artex.fullname" . }}
  labels:
    {{- include "artex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artex.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.app.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingress }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    # The agent scans arbitrary targets: egress is open unless the operator
    # lists peers under networkPolicy.egress.
    - {}
    {{- end }}
{{- end }}
