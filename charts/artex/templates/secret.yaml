{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.database.dsn }}
{{- $_ := required "set database.host (or database.dsn, or secrets.existingSecret)" .Values.database.host }}
{{- $_ := required "set database.password (or database.dsn, or secrets.existingSecret)" .Values.database.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artex.fullname" . }}
  labels:
    {{- include "artex.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.dsn }}
  # A full connection string wins over the parts below and carries its own password.
  ARTEX_PG_DSN: {{ .Values.database.dsn | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}
  {{- with .Values.llm.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.secretKey }}
  ARTEX_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
