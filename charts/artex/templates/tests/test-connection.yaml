apiVersion: v1
kind: Pod
metadata:
  name: {{ include "artex.fullname" . }}-test-connection
  labels:
    {{- include "artex.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: health
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - >-
          curl --fail --silent --show-error
          "http://{{ include "artex.fullname" . }}:{{ .Values.service.port }}/api/health"
